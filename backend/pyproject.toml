[project]
name = "citeguard-backend"
version = "0.1.0"
description = "CiteGuard2 backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.30",
  "psycopg2-binary>=2.9.9",
  "pydantic>=2.7.4",
  "pydantic-settings>=2.3.3",
  "alembic>=1.13.2",
  "celery>=5.4.0",
  "redis>=5.0.4",
  "httpx>=0.27.0",
  "requests>=2.32.3",
  "rapidfuzz>=3.9.4",
  "bibtexparser>=1.4.1",
  "openai>=1.35.10",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.2"]

[tool.ruff]
line-length = 100

[tool.pyright]
venvPath = "."
venv = ".venv"
